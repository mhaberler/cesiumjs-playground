<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="controls">
      <label>
        Terrain
        <select id="terrain">
          <option value="reearth">re:earth</option>
          <option value="ion">Cesium World Terrain</option>
          <option value="flat">Flat</option>
        </select>
      </label>
      <label>
        Imagery
        <select id="imagery">
          <option value="esri">Esri</option>
          <option value="osm">OSM</option>
        </select>
      </label>
      <span id="note"></span>
    </div>
    <div id="controls-right">
      <button id="home" type="button" title="Home">⌂</button>
      <button id="scene-mode" type="button">2D</button>
      <div id="geocode-wrap">
        <input id="geocode" type="text" placeholder="Search location…" autocomplete="off" />
        <ul id="geocode-results" hidden></ul>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
