name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build main
        run: |
          cd apps/main
          bun install --frozen-lockfile
          bun run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}

      - name: Build demo1
        run: |
          cd apps/demo1
          bun install --frozen-lockfile
          bun run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}

      - name: Build demo2
        run: |
          cd apps/demo2
          bun install --frozen-lockfile
          bun run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r apps/main/dist/. site/
          mkdir -p site/demo1 site/demo2
          cp -r apps/demo1/dist/. site/demo1/
          cp -r apps/demo2/dist/. site/demo2/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
